version: '3.8'

services:
  # 主应用服务
  app:
    build: .
    container_name: rag-react-app
    ports:
      - "8000:8000"
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - MILVUS_URL=milvus:19530
      - POSTGRES_URL=postgresql://admin:password@postgres:5432/rag_system
      - JINA_API_KEY=${JINA_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    depends_on:
      elasticsearch:
        condition: service_healthy
      milvus:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./config:/app/config
    networks:
      - rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx前端服务
  nginx:
    image: nginx:alpine
    container_name: rag-react-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - rag-network
    restart: unless-stopped

  # Elasticsearch服务
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: rag-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Milvus服务
  milvus:
    image: milvusdb/milvus:v2.3.0
    container_name: rag-milvus
    command: ["milvus", "run", "standalone"]
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    depends_on:
      - etcd
      - minio
    networks:
      - rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # PostgreSQL服务
  postgres:
    image: postgres:15
    container_name: rag-postgres
    environment:
      - POSTGRES_DB=rag_system
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d rag_system"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # MinIO对象存储服务
  minio:
    image: minio/minio:latest
    container_name: rag-minio
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    networks:
      - rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # etcd服务 (Milvus依赖)
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: rag-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    volumes:
      - etcd-data:/etcd-data
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd-data
    ports:
      - "2379:2379"
    networks:
      - rag-network
    restart: unless-stopped

  # Kibana可视化服务
  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.0
    container_name: rag-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - rag-network
    restart: unless-stopped

volumes:
  elasticsearch-data:
    driver: local
  milvus-data:
    driver: local
  postgres-data:
    driver: local
  minio-data:
    driver: local
  etcd-data:
    driver: local

networks:
  rag-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

# 服务配置说明
# 1. app: 主应用服务，包含ReAct智能代理和RAG引擎
# 2. nginx: 前端静态文件服务和反向代理
# 3. elasticsearch: 全文搜索引擎
# 4. milvus: 向量数据库
# 5. postgres: 结构化数据存储
# 6. minio: 对象存储服务
# 7. etcd: 分布式键值存储（Milvus依赖）
# 8. kibana: Elasticsearch可视化界面

# 使用说明
# 1. 设置环境变量: export JINA_API_KEY=your_key
# 2. 启动服务: docker-compose up -d
# 3. 访问应用: http://localhost
# 4. 管理界面: http://localhost:5601 (Kibana)
# 5. 对象存储: http://localhost:9000 (MinIO)

# 健康检查
# curl http://localhost/health          # 应用健康检查
# curl http://localhost:9200/_cluster/health  # Elasticsearch
# curl http://localhost:19530/health    # Milvus (需要特殊工具)
# curl http://localhost:5432/health     # PostgreSQL (需要pg_isready)

# 性能优化
# - 所有服务都配置了健康检查
# - 使用非root用户运行应用
# - 配置了合理的内存限制
# - 支持水平扩展和网络隔离
# - 包含完整的错误恢复机制

# 安全配置
# - 环境变量管理敏感信息
# - 非root用户运行容器
# - 网络隔离和防火墙
# - 定期健康检查和自动重启
# - 数据持久化和备份策略

# 监控和日志
# - 集中的日志收集
# - 实时健康状态监控
# - 性能指标统计
# - 异常告警机制
# - 可视化监控界面 (Kibana)

# 扩展性
# - 支持多实例部署
# - 负载均衡配置
# - 数据分片和集群
# - 自动扩缩容支持
# - 云服务集成准备